name: Déployer sur GitHub Pages

on:
  push:
    branches: [claude/cree-application-w5moka]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Pages doit être activé une fois dans Settings → Pages, source « GitHub Actions » :
      # le jeton d'Actions peut publier, pas créer le site.
      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Rassembler le site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js sw.js manifest.webmanifest _site/
          cp -r icons fonts _site/

      - name: Téléverser l’artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
